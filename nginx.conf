# ASI-Chain Explorer Nginx Configuration

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Only expose the read-only monitoring response on the explorer origin.
    location = /api/indexer/status {
        # Resolve at startup so Linux Docker host-gateway /etc/hosts entries work.
        proxy_pass ${INDEXER_STATUS_URL};
        proxy_pass_request_headers off;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        error_page 502 504 =503 @indexer_status_unavailable;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
    }

    location @indexer_status_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":"Indexer status is unavailable"}';
    }

    # Note: GraphQL and RChain API calls are made directly from browser
    # to external services (localhost:8080 and localhost:40453)

    # Handle client-side routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
