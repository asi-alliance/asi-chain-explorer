# ASI-Chain Explorer Nginx Configuration

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Endpoint configuration written at container start. Never cache it.
    location = /config.js {
        # add_header here replaces the server-level set, so repeat the security headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;
        add_header Cache-Control "no-store" always;
    }

    # Read-only indexer endpoints on the explorer origin.
    location ^~ /api/indexer/address/ {
        if ($uri !~ "^/api/indexer/address/1111[1-9A-HJ-NP-Za-km-z]{36,50}$") { return 400; }
        proxy_pass ${INDEXER_BASE_URL}/api/address/;
        proxy_pass_request_headers off;
        proxy_set_header Host $proxy_host;
        # HTTPS upstreams behind CloudFront need SNI and a non-empty
        # User-Agent; without them the handshake fails or the request is 403.
        proxy_ssl_server_name on;
        proxy_set_header User-Agent "ASI-Chain-Explorer";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        expires -1;
        limit_except GET { deny all; }
    }

    location = /api/indexer/status {
        # Resolve at startup so Linux Docker host-gateway /etc/hosts entries work.
        proxy_pass ${INDEXER_STATUS_URL};
        proxy_pass_request_headers off;
        proxy_set_header Host $proxy_host;
        # HTTPS upstreams behind CloudFront need SNI and a non-empty
        # User-Agent; without them the handshake fails or the request is 403.
        proxy_ssl_server_name on;
        proxy_set_header User-Agent "ASI-Chain-Explorer";
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        error_page 502 504 =503 @indexer_status_unavailable;
        # add_header here replaces the server-level set, so repeat the security headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
    }

    location @indexer_status_unavailable {
        default_type application/json;
        # add_header here replaces the server-level set, so repeat the security headers.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; connect-src 'self' http: https: ws: wss:" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Indexer status is unavailable"}';
    }

    # GraphQL and node API calls go directly from the browser to the endpoints
    # in /config.js.

    # Handle client-side routing (React Router)
    location / {
        # The entry HTML must revalidate: a rebuilt image must not keep serving
        # the previous bundle from the browser cache. Hashed assets keep their
        # long expiry in the static-asset location above.
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
